<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Beautiful dark background badge -->
  <circle cx="16" cy="16" r="15" fill="#0f1524" stroke="url(#grad)" stroke-width="1.5" />
  <!-- The brand 8-pointed star logo scaled and positioned nicely in the center -->
  <g transform="translate(4, 4)">
    <rect x="4" y="4" width="16" height="16" rx="2" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="4" y="4" width="16" height="16" rx="2" transform="rotate(45 12 12)" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
