services:
  db:
    image: postgres:16-alpine
    container_name: bist_analyst_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bist_analyst
      POSTGRES_USER: bist
      POSTGRES_PASSWORD: bist_local_dev
    volumes:
      - bist_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bist -d bist_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bist_pg_data:
    driver: local
