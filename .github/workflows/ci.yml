name: CI - BIST Analyst App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lab-gate:
    name: Test Merkezi ve Uyumluluk Kapısı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install laboratory dependencies
        run: python -m pip install -r requirements.txt pytest httpx ta tabulate
      - name: Install interface test dependencies
        run: npm ci
      - name: Required Python laboratory suites
        run: python scripts/run_lab_gate.py --report public/lab-results.json
      - name: MTF interface compatibility
        run: node --test scripts/test_mtf_lab_ui.cjs
      - name: Save laboratory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-gate-results
          path: public/lab-results.json

  lint-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint --if-present

      - name: TypeScript compile check
        run: npx tsc --noEmit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, lab-gate]
    env:
      GOOGLE_AI_API_KEY: "dummy-for-build"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        uses: actions/download-artifact@v4
        with:
          name: lab-gate-results
          path: public

      - name: Production build after laboratory gate
        run: npm run build
